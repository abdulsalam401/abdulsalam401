<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="Languages chart">
  <style>
    .title { font: 700 18px Arial, Helvetica, sans-serif; fill: #ffffff; }
    .label { font: 600 13px Arial, Helvetica, sans-serif; fill: #dbeafe; }
    .percent { font: 600 12px Arial, Helvetica, sans-serif; fill: #bfdbfe; }
    .bar-bg { fill: rgba(255,255,255,0.08); }
  </style>
  <rect width="100%" height="100%" fill="#0b1220" rx="10"/>
  <text x="20" y="30" class="title">Aggregated Language Usage</text>

  <text x="20" y="70" class="label">Python</text>
  <rect x="160" y="56" width="560" height="18" rx="9" class="bar-bg"/>
  <rect x="160" y="56" width="299" height="18" rx="9" fill="#2b7cff"/>
  <text x="730" y="70" class="percent" text-anchor="end">53.31%</text>

  <text x="20" y="106" class="label">HTML</text>
  <rect x="160" y="92" width="560" height="18" rx="9" class="bar-bg"/>
  <rect x="160" y="92" width="150" height="18" rx="9" fill="#ff6b6b"/>
  <text x="730" y="106" class="percent" text-anchor="end">26.80%</text>

  <text x="20" y="142" class="label">JavaScript</text>
  <rect x="160" y="128" width="560" height="18" rx="9" class="bar-bg"/>
  <rect x="160" y="128" width="53" height="18" rx="9" fill="#ffd166"/>
  <text x="730" y="142" class="percent" text-anchor="end">9.55%</text>

  <text x="20" y="178" class="label">CSS</text>
  <rect x="160" y="164" width="560" height="18" rx="9" class="bar-bg"/>
  <rect x="160" y="164" width="43" height="18" rx="9" fill="#9d7cff"/>
  <text x="730" y="178" class="percent" text-anchor="end">7.65%</text>

  <text x="20" y="214" class="label">TypeScript</text>
  <rect x="160" y="200" width="560" height="18" rx="9" class="bar-bg"/>
  <rect x="160" y="200" width="11" height="18" rx="9" fill="#00c2a8"/>
  <text x="730" y="214" class="percent" text-anchor="end">1.93%</text>

  <text x="20" y="256" class="percent">This file is auto-updated by the language summary workflow.</text>
</svg>
